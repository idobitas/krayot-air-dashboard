name: Update air data

on:
  schedule:
    # Every 15 min, offset from :00 (GitHub drops/delays many schedules at the top of the hour).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-air
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install py-air-sviva-api (not on PyPI; pinned GitHub commit)
        run: pip install git+https://github.com/GuyKh/py-air-sviva-api.git@6e8bd65315910ef12019ac6798fa417cf5148118
      - name: Fetch data
        run: python scripts/fetch_sviva.py
      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain live_krayot.json data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live_krayot.json data/history_90d.json data/archives_index.json data/archive_*.json
            git commit -m "chore: update live_krayot.json"
            git pull --rebase origin main
            git push
          else
            echo "No changes"
          fi
