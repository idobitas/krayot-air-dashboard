name: Update air data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-air
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install py-air-sviva-api (not on PyPI; installed from GitHub)
        run: pip install git+https://github.com/GuyKh/py-air-sviva-api.git
      - name: Fetch data
        run: python scripts/fetch_sviva.py
      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain live_krayot.json data/history_90d.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live_krayot.json data/history_90d.json
            git commit -m "chore: update live_krayot.json"
            git pull --rebase origin main
            git push
          else
            echo "No changes"
          fi
